<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="40"
   height="40"
   viewBox="0 0 40 40"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <clipPath id="circleClip">
      <circle
         cx="20"
         cy="20"
         r="19" />
    </clipPath>
  </defs>

  <!-- Hintergrundkreis -->
  <circle
     cx="20"
     cy="20"
     r="19"
     fill="#e6e6e6" />

  <!-- Dreieck / Pfeilfläche:
       Spitzen berühren die Kreisumrandung von innen -->
  <path
     d="M 10.23761,4.54943 L 38.3,20 L 10.23761,35.45057 Z"
     fill="#808080"
     clip-path="url(#circleClip)" />

  <!-- Kreisumrandung -->
  <circle
     cx="20"
     cy="20"
     r="19"
     fill="none"
     stroke="#808080"
     stroke-width="1.4" />
</svg>