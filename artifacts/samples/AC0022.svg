     id="title">Röhrenschema</title><desc
     id="desc">Zwei lange vertikale Linien: links blau, rechts rot. Eine horizontale blaue Linie verbindet auf Höhe 68. Unten links ein blaues Dreieck mit Spitze nach unten, unten rechts ein rotes Dreieck mit Spitze nach oben.</desc><!-- Farben --><defs
     id="defs1"><style
       id="style1">
      .blue { stroke: #006fb0; fill: #006fb0; }
      .red  { stroke: #ff0000; fill: #ff0000; }
      .pipe { stroke-width: 1.4; stroke-linecap: butt; }
    </style></defs><!-- Rohre / Linien --><path
