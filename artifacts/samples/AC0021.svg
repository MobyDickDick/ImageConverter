   xmlns:dc="http://purl.org/dc/elements/1.1/"><title
     id="title">Röhrenschema</title><desc
     id="desc">Zwei lange vertikale Linien: links blau, rechts rot. Eine horizontale blaue Linie verbindet auf Höhe 68. Unten links ein blaues Dreieck mit Spitze nach unten, unten rechts ein rotes Dreieck mit Spitze nach oben.</desc><!-- Farben --><defs
     id="defs1"><style
       id="style1">
      .blue { stroke: #006fb0; fill: #006fb0; }
      .red  { stroke: #ff0000; fill: #ff0000; }
      .pipe { stroke-width: 1.4; stroke-linecap: butt; }
    </style></defs><!-- Rohre / Linien --><path
     class="blue pipe"
     d="M 6,0 V 98.95203"
     id="path1" /><path
     class="blue pipe"
     d="M 6.1439114,68 H 30"
     id="path2" /><path
     class="red pipe"
     d="M 30,0 V 98.405904"
     id="path3" /><!-- Pfeile / Dreiecke --><polygon
     class="blue"
     points="6,111 0,101 12,101 "
     id="polygon3-8"
     style="fill:#006fb0;stroke:#006fb0"
     transform="matrix(0.77864902,0,0,1.0179404,1.3281059,-2.8934149)" /><polygon
     class="blue"
     points="0,101 12,101 6,111 "
     id="polygon3-8-5"
     style="fill:#ff0000;fill-opacity:1;stroke:#ff0000;stroke-opacity:1"
     transform="matrix(0.77864902,0,0,-1.0179404,25.328106,213.39024)" /><metadata
     id="metadata4"><rdf:RDF><cc:Work
