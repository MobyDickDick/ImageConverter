<svg xmlns="http://www.w3.org/2000/svg" width="36" height="111" viewBox="0 0 34.719032 111.08723" role="img" aria-labelledby="title desc" version="1.1" id="svg4" xml:space="preserve"><title id="title">Röhrenschema</title><desc id="desc">Zwei lange vertikale Linien: links blau, rechts rot. Eine horizontale blaue Linie verbindet auf Höhe 68. Unten links ein blaues Dreieck mit Spitze nach unten, unten rechts ein rotes Dreieck mit Spitze nach oben.</desc><defs id="defs1" /><g transform="translate(0.000000 0.000000) scale(1.000000)"><path class="blue pipe" d="M 30.15985,67.83337 H 5.29286" id="path2" stroke="#8a2023" fill="none" stroke-width="1.400000" stroke-linecap="butt" fill-opacity="1" stroke-opacity="0.9135" /><path class="blue pipe" d="M 29.63723,0.44435 V 108.62095" id="path1" stroke="#315b7c" fill="#006fb0" stroke-width="1.400000" stroke-linecap="butt" /><path class="red pipe" d="M 5.3595154,0.44435 V 109.03054" id="path3" stroke="#98363d" fill="#ff0000" stroke-width="1.400000" stroke-linecap="butt" /><polygon class="blue" points="5.83337,111.33326 -0.511,101.33326 12.27772,101.33326 " id="polygon3-8" transform="matrix(-0.77864902,0,0,1.0179404,34.031409,-2.8934149)" stroke="#3f77a2" fill="#1f6aa2" /><polygon class="blue" points="-1.01089,101.16663 13.17752,101 6.27772,112.16642 " id="polygon3-8-5" transform="matrix(-0.77864902,0,0,-1.0179404,10.031409,213.39024)" stroke="#febdb5" fill="#e00b10" fill-opacity="1" stroke-opacity="0.889" /></g></svg>