<svg xmlns="http://www.w3.org/2000/svg" width="40" height="140" viewBox="0 0 34.719032 111.08723" role="img" aria-labelledby="title desc" version="1.1" id="svg4" xml:space="preserve"><title id="title">Röhrenschema</title><desc id="desc">Zwei lange vertikale Linien: links blau, rechts rot. Eine horizontale blaue Linie verbindet auf Höhe 68. Unten links ein blaues Dreieck mit Spitze nach unten, unten rechts ein rotes Dreieck mit Spitze nach oben.</desc><defs id="defs1" /><g transform="translate(0.000000 0.000000) scale(1.000000)"><path class="blue pipe" d="M 29.52615,-6.66523 V 118.06336" id="path1" stroke="#297cb5" fill="#006fae" stroke-width="1.400000" stroke-linecap="butt" /><path class="red pipe" d="M 5.19288,-6.66523 V 115.69577" id="path3" stroke="#e6423f" fill="#ff0000" stroke-width="1.466650" stroke-linecap="butt" /><polygon class="blue" points="3.22282,124.16383 6.66523,79.44909 5.56805,113.53064 " id="polygon3-8" transform="matrix(-0.77864902,0,0,1.0179404,34.031409,-2.8934149)" stroke="#4b95c2" fill="#0055a7" /><polygon class="blue" points="-1.11087,93.50162 12.06665,94.94575 5.76672,103.9904 " id="polygon3-8-5" transform="matrix(-0.77864902,0,0,-1.0179404,10.031409,213.39024)" stroke="#fd0101" fill="#fc0101" fill-opacity="0.9985" stroke-opacity="0.876" /></g></svg>