<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <g transform="translate(20.000 20.000) rotate(180) scale(1.0800) translate(-20.000 -20.000)">
<title
     id="title">Kompressor-Symbol</title>
  <desc
     id="desc">Grüner Kreis mit dünnem grauem Rand und zwei schrägen weißen, horizontal gespiegelten Linien.</desc>
  <defs
     id="defs1">
    <clipPath
       id="clip-circle">
      <circle
         cx="25"
         cy="25"
         r="22.5"
         id="circle1" />
    </clipPath>
  </defs>
  <!-- Hintergrundfläche des Symbols -->
  <circle
     cx="25"
     cy="25"
     r="22.5"
     fill="#4cab5a"
     id="circle2" />
  <!-- Zwei schräge, bezüglich des horizontalen Durchmessers symmetrische Linien -->
  <g
     clip-path="url(#clip-circle)"
     fill="none"
     stroke="#f4f4f4"
     stroke-width="1.35"
     stroke-linecap="round"
     id="g3">
    <line
       x1="12.6"
       y1="6.8"
       x2="47.4"
       y2="20.2"
       id="line2" />
    <line
       x1="12.6"
       y1="43.2"
       x2="47.4"
       y2="29.8"
       id="line3" />
  </g>
  <!-- Dünner grauer Rand -->
  <circle
     cx="25"
     cy="25"
     r="22.5"
     fill="none"
     stroke="#b8b8b8"
     stroke-width="0.9"
     id="circle3" />
  <metadata
     id="metadata3">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Kompressor-Symbol</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  </g>
</svg>