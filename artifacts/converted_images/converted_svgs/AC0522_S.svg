     d="M 39,20 10.5,3.545 10.5,36.455 Z"
     clip-path="url(#circleClip)"
     id="path2"
     style="fill:none;stroke:#808080;stroke-width:1.4;stroke-linecap:butt;stroke-dasharray:none;stroke-opacity:1" />

  <!-- Kreisumrandung -->
  <circle
     cx="20"
     cy="20"
     r="19"
     fill="none"
     stroke="#808080"
     stroke-width="1.4"
     id="circle3" />
  </g>
  </g>
  </g>
