<svg width="40" height="20" viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <g transform="translate(20.000 10.000) rotate(180) scale(1.0000) translate(-20.000 -10.000)">
<g transform="translate(30.000 15.000) rotate(0) scale(1.6492) translate(-30.000 -15.000)">
<g transform="translate(20.000 20.000) rotate(90) scale(1.5500) translate(-20.000 -20.000)">
<defs id="defs1">
    <clipPath id="circleClip">
      <circle cx="20" cy="20" r="19" id="circle1" />
    </clipPath>
  </defs>

  <!-- Hintergrundkreis -->
  <ellipse
     cx="20"
     cy="20"
     fill="#e6e6e6"
     id="circle2"
     rx="19"
     ry="18.58252" />

  <!-- Gleichseitiges Dreieck, Spitzen auf dem Innenkreis -->
