<svg width="20" height="60" viewBox="0 0 20 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <g transform="translate(10.000 30.000) rotate(180) scale(0.8000) translate(-10.000 -30.000)">
<g transform="translate(10.000 10.000) rotate(0) scale(0.7400) translate(-10.000 -10.000)">
<g transform="translate(15.500 15.500) rotate(180) scale(0.7400) translate(-15.500 -15.500)">
<defs>
    <clipPath id="circleClip">
      <circle
         cx="20"
         cy="20"
         r="19" />
    </clipPath>
  </defs>

  <!-- Hintergrundkreis -->
  <circle
     cx="20"
     cy="20"
     r="19"
     fill="#e6e6e6" />

  <!-- Dreieck / Pfeilfläche:
       Spitzen berühren die Kreisumrandung von innen -->
  <path
     d="M 10.23761,4.54943 L 38.3,20 L 10.23761,35.45057 Z"
     fill="#808080"
     clip-path="url(#circleClip)" />

  <!-- Kreisumrandung -->
  <circle
     cx="20"
     cy="20"
     r="19"
     fill="none"
     stroke="#808080"
     stroke-width="1.4" />
  </g>
  </g>
  </g>
</svg>