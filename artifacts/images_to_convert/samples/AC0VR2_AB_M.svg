<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="60"
   height="30"
   viewBox="0 0 60 30"
   role="img"
   aria-label="Graues symmetrisches Symbol mit Verlauf, Rand und Linien"
   version="1.1"
   id="svg10"
  
  
  
  
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  
  <defs
     id="defs7">
    <linearGradient
       id="verticalGrey"
       x1="0"
       y1="0"
       x2="0"
       y2="30"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#b4b4b4"
         id="stop1" />
      <stop
         offset="0.24"
         stop-color="#ededed"
         id="stop2" />
      <stop
         offset="0.43"
         stop-color="#fbfbfb"
         id="stop3" />
      <stop
         offset="0.50"
         stop-color="#eeeeee"
         id="stop4" />
      <stop
         offset="0.57"
         stop-color="#fbfbfb"
         id="stop5" />
      <stop
         offset="0.76"
         stop-color="#ededed"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#b4b4b4"
         id="stop7" />
    </linearGradient>
  </defs>
  <!-- Grundfläche mit vertikal symmetrischem Grau-Verlauf -->
  <rect
     x="0.5"
     y="0.5"
     width="59"
     height="29"
     fill="url(#verticalGrey)"
     stroke="#adadad"
     stroke-width="1"
     id="rect7" />
  <!-- Zwei symmetrische schräge Linien -->
  <path
     d="M 0.8 9.4 L 59.2 3.8"
     fill="none"
     stroke="#afafaf"
     stroke-width="1"
     stroke-linecap="round"
     id="path7" />
  <path
     d="M 0.8 20.6 L 59.2 26.2"
     fill="none"
     stroke="#afafaf"
     stroke-width="1"
     stroke-linecap="round"
     id="path8" />
  <!-- Zwei kurze horizontale Linien rechts -->
  <path
     d="M 41 12.2 H 53"
     fill="none"
     stroke="#b2b2b2"
     stroke-width="0.9"
     stroke-linecap="round"
     id="path9" />
  <path
     d="M 41 16.8 H 53"
     fill="none"
     stroke="#b2b2b2"
     stroke-width="0.9"
     stroke-linecap="round"
     id="path10" />
</svg>
