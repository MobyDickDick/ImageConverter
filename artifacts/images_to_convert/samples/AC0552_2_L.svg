      <stop
         offset="0"
         style="stop-color:#5fa668;stop-opacity:1"
         id="stop1-9" />
      <stop
         offset="0.38"
         style="stop-color:#4ccd5b;stop-opacity:1"
         id="stop2-4" />
      <stop
         offset="0.46"
