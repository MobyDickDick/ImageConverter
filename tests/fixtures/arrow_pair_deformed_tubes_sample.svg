<svg xmlns="http://www.w3.org/2000/svg" width="30" height="110" viewBox="0 0 38.719032 139.9897" role="img" aria-labelledby="title desc" version="1.1" id="svg4" xml:space="preserve"><title id="title">Röhrenschema</title><desc id="desc">Zwei lange vertikale Linien: links blau, rechts rot. Eine horizontale blaue Linie verbindet auf Höhe 68. Unten links ein blaues Dreieck mit Spitze nach unten, unten rechts ein rotes Dreieck mit Spitze nach oben.</desc><defs id="defs1" /><g transform="translate(0.000000 -0.046533) scale(1.000000)"><polygon class="blue" points="2.29028,108.2002 8.39938,94.08451 12,109.95934 " id="polygon3-8" transform="matrix(-0.77864902,0,0,1.0179404,38.031409,26.009049)" stroke="#6ca4c9" fill="#1c75b4" /><path class="blue pipe" d="M 32.35493,-8.39938 V 147.41539" id="path1" stroke="#72aace" fill="#0070b3" stroke-width="2.166975" stroke-linecap="butt" /><path class="red pipe" d="M 6.54943,-8.39327 V 130.70781" id="path3" stroke="#e95f5c" fill="#fb0101" stroke-width="1.749980" stroke-linecap="butt" /><polygon class="blue" points="4.79609,108.95615 -1.60988,98.83016 15.28976,93.16058 " id="polygon3-8-5" transform="matrix(-0.77864902,0,0,-1.0179404,10.031409,242.2927)" stroke="#fa0007" fill="#fc0000" fill-opacity="0.9575" stroke-opacity="1" /></g></svg>