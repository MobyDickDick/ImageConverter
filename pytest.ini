[pytest]
testpaths = tests
norecursedirs = vendor .git .venv venv build dist
markers =
    blocking_conversion: Tests with currently blocking conversion behaviour; tracked outside the core-green profile.
    optional_fixture: Tests that require optional/non-default fixtures or datasets.
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
