name: Exploratory acceptance

on:
  push:
    branches: [experimental/explorative-conversion]
    paths:
      - 'src/exploratory/**'
      - 'tests/test_exploratory_*.py'
      - 'tools/exploratory_demo.py'
      - '.github/workflows/exploratory.yml'
  pull_request:
    paths:
      - 'src/exploratory/**'
      - 'tests/test_exploratory_*.py'
      - 'tools/exploratory_demo.py'
      - '.github/workflows/exploratory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10.11 is available for Ubuntu 24.04, not Ubuntu 26.04.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify AP 1, AP 2 and the offline gallery with real rendering and metrics
        run: python -m pytest -q -rA tests/test_exploratory_ap1.py tests/test_exploratory_ap2.py tests/test_exploratory_demo.py --junitxml=artifacts/exploratory/acceptance.xml
      - name: Generate visible AP 1 and AP 2 gallery
        run: python -m tools.exploratory_demo --output artifacts/exploratory/gallery
      - name: Link gallery artifact from run summary
        shell: bash
        run: |
          echo '### AP 1/2: sichtbare Demo' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artefakt exploratory-acceptance-${{ matrix.os }} herunterladen, entpacken und gallery/index.html öffnen. Enthält Originale, SVGs, Unterschiedsbilder und report.json. Alle Ergebnisse sind Entwürfe ohne semantische Freigabe.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-acceptance-${{ matrix.os }}
          path: artifacts/exploratory/
          if-no-files-found: error
          retention-days: 30
