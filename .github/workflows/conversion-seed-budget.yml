name: Conversion seed and time budget

on:
  push:
    branches: ['codex/ac0233-seed-budget']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversion-seed-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - run: python -m pip install -r requirements-dev.txt
      - name: Check complete inventory, seed replay and continued search
        run: >-
          python -m pytest -q tests/test_joined_triangle_badge.py
          tests/test_primitive_evolution.py tests/test_seed_search_effect.py
          tests/test_description_registration_search.py tests/test_unified_search_context.py
          tests/test_polygon_renderer_closure.py tests/detailtests/test_rendering_gradient_compatibility.py
          tests/detailtests/test_svg_gradient_references.py tests/test_scoped_paint.py
          --junitxml=ci-evidence/seed-budget.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-budget-contracts
          path: ci-evidence/
          retention-days: 7
  gui-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [quick, normal, thorough, explore5, explore10]
        seed: [17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - run: python -m pip install -r requirements-dev.txt
      - name: Convert original through the production GUI worker
        env:
          IMAGE_CONVERTER_ISOLATE_SVG_RENDER: '0'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m tools.check_joined_triangle_profiles --profile ${{ matrix.profile }}
          --seed ${{ matrix.seed }} --output .tmp/profile-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversion-${{ matrix.profile }}-seed-${{ matrix.seed }}
          path: .tmp/profile-evidence/
          retention-days: 7
  compare-profiles:
    needs: [contracts, gui-profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conversion-*
          path: profile-results
      - name: Require real seed effects across all five profiles
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path('profile-results').glob('*/summary.json')]
          assert len(rows)==10, len(rows)
          limits=dict(quick=45,normal=120,thorough=240,explore5=300,explore10=600)
          table=['| Profile | Seed | Renderings | Seconds | IoU (librsvg) | Render trace |',
                 '|---|---:|---:|---:|---:|---|']
          for row in sorted(rows,key=lambda r:(limits[r['profile']],r['seed'])):
              search=row['search_summary']
              assert row['independent_quality']['passed']
              assert search['limit_seconds']==limits[row['profile']], row
              assert search['render_budget']==1000000, row
              assert search['satisfactory'], row
              table.append(f"| {row['profile']} | {row['seed']} | {search['renderings']} | "
                           f"{row['elapsed']} | {row['independent_quality']['foreground_iou']:.4f} | "
                           f"{search['render_sequence_sha256'][:16]} |")
          for profile in limits:
              paired=[r['search_summary']['render_sequence_sha256'] for r in rows if r['profile']==profile]
              assert len(set(paired))==2, (profile,'Seeds produced identical render sequences')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('\n'.join(table)+'\n')
          PY
