name: Plan B random task acceptance

on:
  pull_request:
  push:
    branches: [main, master, work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sixteen-variations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Try up to nine originals, then require original plus 16 satisfactory variations
        id: acceptance
        run: >-
          python -m tools.run_plan_b_variations
          --svg-dir artifacts/samples
          --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml
          --output-dir artifacts/plan-b-acceptance
      - name: Document every failure as a reproducible task
        if: always()
        env:
          PLAN_B_CONCLUSION: ${{ steps.acceptance.outcome }}
          PLAN_B_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m tools.report_plan_b_failures
          --artifact-dir artifacts/plan-b-acceptance
          --conclusion "$PLAN_B_CONCLUSION"
          --run-url "$PLAN_B_RUN_URL"
      - name: Save original image, selection, quality check and per-case failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-acceptance
          path: artifacts/plan-b-acceptance
          if-no-files-found: error
          retention-days: 14
