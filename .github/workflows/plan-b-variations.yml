name: Plan B random task acceptance

on:
  # Automatic random acceptance is paused while the issue backlog is resolved.
  # Re-enable PR/push triggers explicitly after that work is complete.
  workflow_dispatch:
    inputs:
      seed:
        description: 'Optional selection and variation seed for replay'
        required: false
        type: string

permissions:
  contents: read

jobs:
  sixteen-variations:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Try up to nine originals, then require original plus 16 satisfactory variations
        id: acceptance
        env:
          PLAN_B_SEED: ${{ inputs.seed }}
          PYTHONUNBUFFERED: '1'
        run: |
          args=()
          if [ -n "$PLAN_B_SEED" ]; then args+=(--seed "$PLAN_B_SEED"); fi
          python -m tools.run_plan_b_variations \
            --svg-dir artifacts/samples \
            --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml \
            --output-dir artifacts/plan-b-acceptance \
            --keep-debug-artifacts "${args[@]}"
      - name: Record toolchain and algorithm revision
        if: always()
        run: |
          mkdir -p artifacts/plan-b-diagnostics
          git rev-parse HEAD > artifacts/plan-b-diagnostics/commit.txt
          python -VV > artifacts/plan-b-diagnostics/python.txt 2>&1
          python -m pip freeze > artifacts/plan-b-diagnostics/packages.txt
          uname -a > artifacts/plan-b-diagnostics/platform.txt
      - name: Document every failure as a reproducible task
        if: always()
        env:
          PLAN_B_CONCLUSION: ${{ steps.acceptance.outcome }}
          PLAN_B_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m tools.report_plan_b_failures
          --artifact-dir artifacts/plan-b-acceptance
          --conclusion "$PLAN_B_CONCLUSION"
          --run-url "$PLAN_B_RUN_URL"
      - name: Save original image, selection, quality check and per-case failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-acceptance
          path: artifacts/plan-b-acceptance
          if-no-files-found: error
          retention-days: 14
      - name: Save toolchain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-diagnostics
          path: artifacts/plan-b-diagnostics
          if-no-files-found: error
          retention-days: 14
