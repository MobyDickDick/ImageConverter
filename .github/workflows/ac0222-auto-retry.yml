name: AC0222 circle valve and automatic seed retries

on:
  push:
    branches: ['codex/ac0222-auto-retry']
  pull_request:
    branches: ['codex/green-full-suite']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ac0222-auto-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p ci-evidence
      - name: Retry lifecycle, cancellation, best retention and existing GUI contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          IMAGE_CONVERTER_ISOLATE_SVG_RENDER: '0'
        run: >-
          python -m pytest -q tests/test_seed_retry.py tests/test_image_converter_gui.py
          tests/test_gui_preview.py tests/test_three_wing_valve_description.py
          --basetemp=ci-evidence/contracts --junitxml=ci-evidence/contracts.xml
      - name: Browser controls, polling and existing interface behavior
        if: always()
        run: node --test tests/test_app_background.js tests/gui_app.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-retry-contracts
          path: ci-evidence/
          retention-days: 7
  actual-circle-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p ci-evidence
      - name: Unmodified description, two seeds, two profiles and independent librsvg acceptance
        env:
          OPENBLAS_NUM_THREADS: '1'
          IMAGE_CONVERTER_ISOLATE_SVG_RENDER: '0'
        run: >-
          python -m pytest -q tests/test_three_wing_circle.py
          --basetemp=ci-evidence/circle --junitxml=ci-evidence/circle.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circle-valve-original-svg-and-independent-renders
          path: ci-evidence/
          retention-days: 7
