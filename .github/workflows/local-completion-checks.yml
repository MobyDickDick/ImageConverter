name: Local completion checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

jobs:
  completion-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run documented local completion profile
        run: ./tools/run_local_completion_checks.sh

  batch-artifact-drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Create representative passing drift summary
        run: |
          mkdir -p artifacts/converted_images/reports
          {
            echo "drift_status=pass"
            echo "drift_reasons="
          } > artifacts/converted_images/reports/chain_phase_telemetry_summary.txt

      - name: Run completion profile with mandatory drift summary
        run: ./tools/run_local_completion_checks.sh --require-drift-summary
