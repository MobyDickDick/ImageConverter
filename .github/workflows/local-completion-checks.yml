name: Local completion checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

jobs:
  named-scene-references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate independent named-reference controls
        run: python -m tools.evaluate_real_scene --prepare .tmp/named-inputs --seed 762915 --count 6 --paraphrase
      - name: Convert and independently verify native objects and regions
        run: python -m tools.evaluate_real_scene --inputs .tmp/named-inputs --output .tmp/named-cli --require-all
      - name: Replay saved outputs and verify worker guards
        run: python -m tools.evaluate_real_scene --inputs .tmp/named-inputs --output .tmp/named-cli --verify-only --require-all
      - name: Prepare independently annotated real-family challenge set
        run: python -m tools.evaluate_real_scene --prepare .tmp/real-inputs --real
      - name: Record real-family outcomes without claiming unsupported content as success
        run: python -m tools.evaluate_real_scene --inputs .tmp/real-inputs --output .tmp/real-cli
      - name: Verify real outputs and budget evidence independently
        run: python -m tools.evaluate_real_scene --inputs .tmp/real-inputs --output .tmp/real-cli --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-and-real-scene-evidence
          path: |
            .tmp/named-inputs
            .tmp/named-cli
            .tmp/real-inputs
            .tmp/real-cli
          retention-days: 7

  visible-primitive-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate outlined overlap, containment and explicit depth scenes
        run: python -m tools.evaluate_visibility_scene --prepare .tmp/visibility-inputs --seed 731829 --count 6 --rotate --paraphrase
      - name: Convert and independently check native shapes, outlines and regions
        run: python -m tools.evaluate_visibility_scene --inputs .tmp/visibility-inputs --output .tmp/visibility-cli --require-all
      - name: Re-render saved results and verify worker budgets and reference guards
        run: python -m tools.evaluate_visibility_scene --inputs .tmp/visibility-inputs --output .tmp/visibility-cli --verify-only --require-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-scene-evidence
          path: .tmp/visibility-cli
          retention-days: 7

  fused-primitive-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate unseen rotated occlusion scenes and descriptions
        run: python -m tools.evaluate_fused_scene --prepare .tmp/fused-inputs --seed 871205 --count 6 --rotate --paraphrase
      - name: Convert with supervised workers and check native objects and regions
        run: python -m tools.evaluate_fused_scene --inputs .tmp/fused-inputs --output .tmp/fused-cli --require-all
      - name: Independently replay saved CLI evidence
        run: python -m tools.evaluate_fused_scene --inputs .tmp/fused-inputs --output .tmp/fused-cli --verify-only --require-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-scene-evidence
          path: .tmp/fused-cli
          retention-days: 7

  layered-primitive-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate new filled and nested primitive scenes
        run: python -m tools.evaluate_layered_scene --prepare .tmp/layered-inputs --seed 197323 --count 6 --rotate --paraphrase --wide-nesting
      - name: Convert and independently check supervised CLI outputs
        run: python -m tools.evaluate_layered_scene --inputs .tmp/layered-inputs --output .tmp/layered-cli --require-all
      - name: Re-render saved vectors and verify instance and budget evidence
        run: python -m tools.evaluate_layered_scene --inputs .tmp/layered-inputs --output .tmp/layered-cli --verify-only --require-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layered-scene-evidence
          path: .tmp/layered-cli
          retention-days: 7

  neural-real-regions-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Exact detector replay requires the same BLAS reduction order in both steps.
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Train real-region models and smoke-test paired production workers
        run: python -m tools.run_real_neural_elements --smoke --output-dir .tmp/neural-real-ci --work-dir .tmp/neural-real-ci-work
      - name: Independently verify family splits, instances, CLI outputs and archive
        run: python -m tools.run_real_neural_elements --verify-only --output-dir .tmp/neural-real-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-real-regions-evidence
          path: .tmp/neural-real-ci
          retention-days: 7

  neural-elements-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Train and compare the optional CNN in supervised CLI workers
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m tools.run_neural_elements --smoke --seeds 17 --output-dir .tmp/neural-ci --work-dir .tmp/neural-ci-work
      - name: Independently verify outputs, model switches and archive hashes
        run: python -m tools.run_neural_elements --verify-only --output-dir .tmp/neural-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-elements-evidence
          path: .tmp/neural-ci
          retention-days: 7

  component-value:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Paired production bot ablations and attribution controls
        run: python -m tools.run_component_value --output-dir .tmp/component-value-ci --work-dir .tmp/component-value-ci-work --seeds 17
      - name: Independently verify outputs and observed switches
        run: python -m tools.run_component_value --verify-only --output-dir .tmp/component-value-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-value-evidence
          path: .tmp/component-value-ci
          retention-days: 7

  image-id-hardcoding-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Reject new runtime image IDs
        run: python tools/check_no_new_image_id_hardcoding.py

  completion-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run documented local completion profile with test evidence
        run: >-
          ./tools/run_test_evidence.sh
          --name completion-profile
          --log artifacts/test-evidence/completion-profile.log
          --summary artifacts/test-evidence/completion-profile-summary.md
          -- ./tools/run_local_completion_checks.sh

      - name: Upload completion-profile test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: completion-profile-test-evidence
          path: artifacts/test-evidence
          if-no-files-found: error
          retention-days: 1

  batch-artifact-drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create representative passing drift summary
        run: |
          mkdir -p artifacts/converted_images/reports
          {
            echo "drift_status=pass"
            echo "drift_reasons="
          } > artifacts/converted_images/reports/chain_phase_telemetry_summary.txt

      - name: Run completion profile with mandatory drift summary
        run: ./tools/run_local_completion_checks.sh --require-drift-summary


  pytest-profile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-green
            timeout_minutes: 15
          - profile: extended
            timeout_minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest profile
        run: python tools/run_pytest_profile.py ${{ matrix.profile }}

  safe-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run safe baseline
        env:
          RUN_HEAVY_CONVERSION_TESTS: '1'
        run: ./tools/run_safe_test_baseline.sh

  regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run documented regression checks
        env:
          RUN_HEAVY_CONVERSION_TESTS: '1'
        run: ./tools/run_regression_checks.sh


  satisfactory-regression-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reconvert satisfactory baseline and compare quality
        env:
          RUN_HEAVY_CONVERSION_TESTS: '1'
          SATISFACTORY_REGRESSION_TIMEOUT_SECONDS: '3300'
          SATISFACTORY_REGRESSION_DEBUG_DIR: artifacts/converted_images/reports/satisfactory-regression-debug
        run: ./tools/run_satisfactory_regression_battery.sh

      - name: Upload satisfactory regression debug data
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: satisfactory-regression-debug
          path: artifacts/converted_images/reports/satisfactory-regression-debug
          if-no-files-found: warn
          retention-days: 1

  full-heavy-conversion-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full heavy image composite suite
        env:
          RUN_HEAVY_CONVERSION_TESTS: '1'
          PYTEST_PER_TEST_TIMEOUT_SECONDS: '60'
        run: python -m pytest -q -rs tests/test_image_composite_converter.py

  full-catalog-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Convert catalog shard
        run: >-
          python tools/run_catalog_conversion.py
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --timeout-seconds 180

      - name: Upload catalog shard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: catalog-conversion-shard-${{ matrix.shard }}
          path: artifacts/catalog-conversion/shard-*
          if-no-files-found: error
          retention-days: 3
