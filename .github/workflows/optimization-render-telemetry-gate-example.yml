name: Optimization render telemetry catalog gate

on:
  workflow_dispatch:
    inputs:
      shard_start:
        description: First catalog variant in the deterministic reference shard
        required: true
        default: AC0100_S
        type: string
      shard_end:
        description: Last catalog variant in the deterministic reference shard
        required: true
        default: AC0100_S
        type: string
      baseline_run_id:
        description: Optional override for the recommended baseline run ID
        required: false
        type: string
      baseline_artifact_name:
        description: Optional override for the recommended versioned baseline artifact
        required: false
        type: string
      promote_baseline:
        description: Publish the accepted candidate as a versioned baseline artifact
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  TELEMETRY_CANDIDATE_NAME: optimization-render-telemetry-baseline-candidate

jobs:
  record-reference-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Record catalog-shard reference
        env:
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: >-
          python -m src.imageCompositeConverter
          artifacts/images_to_convert
          --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml
          --output-dir artifacts/ci-optimization-render-reference
          --start "$SHARD_START"
          --end "$SHARD_END"
          --deterministic-order
          --fail-on-batch-failures

      - name: Validate baseline candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(
              "artifacts/ci-optimization-render-reference/reports/"
              "optimization_render_telemetry_summary.json"
          )
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "optimization_render_telemetry_summary_v1", payload
          assert payload["conversion_count"] > 0, payload
          PY

      - name: Upload baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TELEMETRY_CANDIDATE_NAME }}
          path: artifacts/ci-optimization-render-reference/reports/optimization_render_telemetry_summary.json
          if-no-files-found: error
          retention-days: 7

  strict-converter-call:
    needs: record-reference-shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate resolved baseline alias
        id: baseline
        run: >-
          python tools/resolve_optimization_telemetry_baseline.py
          --input-run-id "$INPUT_RUN_ID"
          --input-artifact-name "$INPUT_ARTIFACT_NAME"
          --variable-run-id "$VARIABLE_RUN_ID"
          --variable-artifact-name "$VARIABLE_ARTIFACT_NAME"
          --github-output "$GITHUB_OUTPUT"
        env:
          INPUT_RUN_ID: ${{ inputs.baseline_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
          VARIABLE_RUN_ID: ${{ vars.OPTIMIZATION_RENDER_TELEMETRY_BASELINE_RUN_ID }}
          VARIABLE_ARTIFACT_NAME: ${{ vars.OPTIMIZATION_RENDER_TELEMETRY_BASELINE_ARTIFACT_NAME }}

      - name: Download explicitly selected promoted baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          path: telemetry-baseline
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate promoted baseline provenance
        env:
          BASELINE_ARTIFACT_NAME: ${{ steps.baseline.outputs.artifact_name }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("telemetry-baseline")
          provenance = json.loads((root / "provenance.json").read_text(encoding="utf-8"))
          assert provenance["schema_version"] == "optimization_render_telemetry_baseline_provenance_v1", provenance
          assert provenance["source_run_id"] == int(os.environ["BASELINE_RUN_ID"]), provenance
          expected_name = (
              "optimization-render-telemetry-baseline-"
              f"{provenance['source_run_id']}-{provenance['source_run_attempt']}"
          )
          assert os.environ["BASELINE_ARTIFACT_NAME"] == expected_name, provenance
          assert provenance["shard_start"] == os.environ["SHARD_START"], provenance
          assert provenance["shard_end"] == os.environ["SHARD_END"], provenance
          summary = json.loads(
              (root / "optimization_render_telemetry_summary.json").read_text(encoding="utf-8")
          )
          assert summary["schema_version"] == "optimization_render_telemetry_summary_v1", summary
          assert summary["conversion_count"] > 0, summary
          PY

      - name: Run strict telemetry gate on catalog shard
        env:
          ICC_OPTIMIZATION_RENDER_TELEMETRY_BASELINE: telemetry-baseline/optimization_render_telemetry_summary.json
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: >-
          python -m src.imageCompositeConverter
          artifacts/images_to_convert
          --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml
          --output-dir artifacts/ci-optimization-render-telemetry
          --start "$SHARD_START"
          --end "$SHARD_END"
          --deterministic-order
          --fail-on-batch-failures
          --fail-on-optimization-render-regression

      - name: Verify passing gate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(
              "artifacts/ci-optimization-render-telemetry/reports/"
              "optimization_render_telemetry_comparison.json"
          )
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["regression_gate"]["status"] == "passed", payload
          PY

      - name: Record and verify alias activation receipt
        env:
          VERIFICATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          VERIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFICATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          python tools/record_optimization_telemetry_alias_verification.py \
            telemetry-baseline/recommended-baseline-alias.json \
            telemetry-alias-verification.json \
            --workflow-run-id "$VERIFICATION_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$VERIFICATION_WORKFLOW_RUN_ATTEMPT" \
            --verification-source-sha "$VERIFICATION_SOURCE_SHA" \
            --gate-status passed
          python tools/check_optimization_telemetry_alias_verification.py \
            telemetry-baseline/recommended-baseline-alias.json \
            telemetry-alias-verification.json

      - name: Upload verified alias activation receipt
        uses: actions/upload-artifact@v4
        with:
          name: optimization-render-telemetry-alias-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: telemetry-alias-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-render-telemetry-gate-reports
          path: artifacts/ci-optimization-render-telemetry/reports
          if-no-files-found: warn
          retention-days: 7

  promote-baseline:
    if: ${{ inputs.promote_baseline }}
    needs: strict-converter-call
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TELEMETRY_CANDIDATE_NAME }}
          path: promoted-baseline

      - name: Add promotion provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema_version": "optimization_render_telemetry_baseline_provenance_v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "shard_start": os.environ["SHARD_START"],
              "shard_end": os.environ["SHARD_END"],
          }
          Path("promoted-baseline/provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build recommended baseline alias manifest
        run: >-
          python tools/build_optimization_telemetry_baseline_alias.py
          promoted-baseline/provenance.json
          promoted-baseline/recommended-baseline-alias.json

      - name: Publish alias activation summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          alias = json.loads(Path("promoted-baseline/recommended-baseline-alias.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Promoted telemetry baseline\n\n")
              summary.write("Update both repository variables together before the alias is active:\n\n")
              for name, value in alias["repository_variables"].items():
                  summary.write(f"- `{name}` = `{value}`\n")
              summary.write("\nRun the generated activation commands:\n\n```bash\n")
              for command in alias["activation_commands"]:
                  summary.write(f"{command}\n")
              summary.write("```\n")
              summary.write("\nThen verify the activated alias without baseline overrides:\n\n")
              summary.write(f"`{alias['verification_command']}`\n")
          PY

      - name: Upload versioned baseline
        uses: actions/upload-artifact@v4
        with:
          name: optimization-render-telemetry-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: promoted-baseline
          if-no-files-found: error
          retention-days: 30
