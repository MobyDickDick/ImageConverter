name: Optimization render telemetry catalog gate

on:
  workflow_dispatch:
    inputs:
      shard_start:
        description: First catalog variant in the deterministic reference shard
        required: true
        default: AC0100_S
        type: string
      shard_end:
        description: Last catalog variant in the deterministic reference shard
        required: true
        default: AC0100_S
        type: string
      baseline_run_id:
        description: Run ID that published the promoted baseline artifact
        required: true
        type: string
      baseline_artifact_name:
        description: Exact versioned promoted baseline artifact name
        required: true
        type: string
      promote_baseline:
        description: Publish the accepted candidate as a versioned baseline artifact
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  TELEMETRY_CANDIDATE_NAME: optimization-render-telemetry-baseline-candidate

jobs:
  record-reference-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Record catalog-shard reference
        env:
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: >-
          python -m src.imageCompositeConverter
          artifacts/images_to_convert
          --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml
          --output-dir artifacts/ci-optimization-render-reference
          --start "$SHARD_START"
          --end "$SHARD_END"
          --deterministic-order
          --fail-on-batch-failures

      - name: Validate baseline candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(
              "artifacts/ci-optimization-render-reference/reports/"
              "optimization_render_telemetry_summary.json"
          )
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "optimization_render_telemetry_summary_v1", payload
          assert payload["conversion_count"] > 0, payload
          PY

      - name: Upload baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TELEMETRY_CANDIDATE_NAME }}
          path: artifacts/ci-optimization-render-reference/reports/optimization_render_telemetry_summary.json
          if-no-files-found: error
          retention-days: 7

  strict-converter-call:
    needs: record-reference-shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download explicitly selected promoted baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact_name }}
          path: telemetry-baseline
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Validate promoted baseline provenance
        env:
          BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("telemetry-baseline")
          provenance = json.loads((root / "provenance.json").read_text(encoding="utf-8"))
          assert provenance["schema_version"] == "optimization_render_telemetry_baseline_provenance_v1", provenance
          assert provenance["source_run_id"] == int(os.environ["BASELINE_RUN_ID"]), provenance
          expected_name = (
              "optimization-render-telemetry-baseline-"
              f"{provenance['source_run_id']}-{provenance['source_run_attempt']}"
          )
          assert os.environ["BASELINE_ARTIFACT_NAME"] == expected_name, provenance
          assert provenance["shard_start"] == os.environ["SHARD_START"], provenance
          assert provenance["shard_end"] == os.environ["SHARD_END"], provenance
          summary = json.loads(
              (root / "optimization_render_telemetry_summary.json").read_text(encoding="utf-8")
          )
          assert summary["schema_version"] == "optimization_render_telemetry_summary_v1", summary
          assert summary["conversion_count"] > 0, summary
          PY

      - name: Run strict telemetry gate on catalog shard
        env:
          ICC_OPTIMIZATION_RENDER_TELEMETRY_BASELINE: telemetry-baseline/optimization_render_telemetry_summary.json
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: >-
          python -m src.imageCompositeConverter
          artifacts/images_to_convert
          --descriptions-path artifacts/images_to_convert/Finale_Wurzelformen_V3.xml
          --output-dir artifacts/ci-optimization-render-telemetry
          --start "$SHARD_START"
          --end "$SHARD_END"
          --deterministic-order
          --fail-on-batch-failures
          --fail-on-optimization-render-regression

      - name: Verify passing gate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(
              "artifacts/ci-optimization-render-telemetry/reports/"
              "optimization_render_telemetry_comparison.json"
          )
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["regression_gate"]["status"] == "passed", payload
          PY

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-render-telemetry-gate-reports
          path: artifacts/ci-optimization-render-telemetry/reports
          if-no-files-found: warn
          retention-days: 7

  promote-baseline:
    if: ${{ inputs.promote_baseline }}
    needs: strict-converter-call
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TELEMETRY_CANDIDATE_NAME }}
          path: promoted-baseline

      - name: Add promotion provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARD_START: ${{ inputs.shard_start }}
          SHARD_END: ${{ inputs.shard_end }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema_version": "optimization_render_telemetry_baseline_provenance_v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "shard_start": os.environ["SHARD_START"],
              "shard_end": os.environ["SHARD_END"],
          }
          Path("promoted-baseline/provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload versioned baseline
        uses: actions/upload-artifact@v4
        with:
          name: optimization-render-telemetry-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: promoted-baseline
          if-no-files-found: error
          retention-days: 30
