name: Plan B issue regressions

on:
  pull_request:
    paths:
      - 'src/iCCModules/imageCompositeConverterChevronPanel.py'
      - 'src/iCCModules/imageCompositeConverterArrowPair.py'
      - 'src/iCCModules/imageCompositeConverterDualArrowRuntime.py'
      - 'src/iCCModules/imageCompositeConverterFilledSymbols.py'
      - 'src/iCCModules/imageCompositeConverterRendering.py'
      - 'src/iCCModules/imageCompositeConverterSvgStyles.py'
      - 'tests/test_arrow_pair_runtime.py'
      - 'src/iCCModules/imageCompositeConverterZigzagPanel.py'
      - 'tests/test_zigzag_panel_runtime.py'
      - 'artifacts/samples/AC0130_L.txt'
      - 'artifacts/evaluation/repeated_panel_ci_v1/**'
      - 'artifacts/evaluation/arrow_pair_issue_v1/**'
      - 'artifacts/images_to_convert/Finale_Wurzelformen_V3.xml'
      - 'src/iCCModules/imageCompositeConverterAdaptiveSearch.py'
      - 'tools/run_plan_b_variations.py'
      - 'tools/replay_plan_b_issue_batch.py'
      - 'tools/inventory_plan_b_issues.py'
      - 'tests/test_chevron_panel_runtime.py'
      - 'tests/test_valley_panel_runtime.py'
      - 'tools/evaluate_valley_panel.py'
      - 'tools/verify_valley_panel_acceptance.py'
      - 'artifacts/evaluation/valley_panel_issue_v1/**'
      - 'tests/test_plan_b_issue_inventory.py'
      - 'artifacts/evaluation/issue_backlog_v1/**'
      - '.github/workflows/plan-b-issue-regressions.yml'
  workflow_dispatch:

jobs:
  downward-chevron-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check both chevron directions, catalog mapping and negative controls
        run: python -m pytest -q tests/test_valley_panel_runtime.py tests/test_chevron_panel_runtime.py
      - name: Replay both complete historical issue seeds
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/valley_panel_issue_v1/manifest.json --output-dir .tmp/valley-frozen
      - name: Replay an independent seed
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/valley_panel_issue_v1/manifest.json --output-dir .tmp/valley-holdout --issues 1909 --seed 817263
      - name: Check unrelated colors, asymmetric arms and all three JPEG sizes
        run: python -m tools.evaluate_valley_panel --output-dir .tmp/valley-independent
      - name: Independently verify saved vectors, raster gates, hashes and actual budgets
        run: python -m tools.verify_valley_panel_acceptance --run .tmp/valley-frozen/1909 --run .tmp/valley-frozen/1999 --run .tmp/valley-holdout/1909 --independent .tmp/valley-independent --summary .tmp/valley-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valley-panel-issue-replays
          path: |
            .tmp/valley-frozen
            .tmp/valley-holdout
            .tmp/valley-independent
            .tmp/valley-checks.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  repeated-panel-ci-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check source-bound descriptions, crop registration and previous controls
        run: python -m pytest -q tests/test_zigzag_panel_runtime.py tests/detailtests/test_plan_b_variations.py
      - name: Replay the fixed source and its recorded variations without pool selection
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/repeated_panel_ci_v1/manifest.json --output-dir .tmp/repeated-panel-frozen
      - name: Check an additional variation seed
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/repeated_panel_ci_v1/manifest.json --output-dir .tmp/repeated-panel-holdout --seed 20261025
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-panel-ci-replays
          path: |
            .tmp/repeated-panel-frozen
            .tmp/repeated-panel-holdout
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  native-arrow-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check native inventory, CSS cascade, JPEG and negative controls
        run: python -m pytest -q tests/test_arrow_pair_runtime.py tests/detailtests/test_dual_arrow_runtime_helpers.py tests/detailtests/test_rendering_gradient_compatibility.py tests/test_filled_symbols_runtime.py
      - name: Replay corrected description with the full original issue seed
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/arrow_pair_issue_v1/manifest.json --output-dir .tmp/arrow-pair-frozen
      - name: Replay an additional variation seed
        run: python -m tools.replay_plan_b_issue_batch --manifest artifacts/evaluation/arrow_pair_issue_v1/manifest.json --output-dir .tmp/arrow-pair-holdout --seed 817263
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arrow-pair-replays
          path: |
            .tmp/arrow-pair-frozen
            .tmp/arrow-pair-holdout
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  cropped-gradient-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check semantics, real holdouts, deadline and exact seeds
        run: python -m pytest -q tests/test_chevron_panel_runtime.py tests/test_plan_b_issue_inventory.py
      - name: Replay all three original issue seeds through the CLI
        run: python -m tools.replay_plan_b_issue_batch --output-dir .tmp/issues-frozen
      - name: Replay an independent holdout seed
        run: python -m tools.replay_plan_b_issue_batch --output-dir .tmp/issues-holdout --issues 1969 --seed 942817
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-b-issue-replays
          path: |
            .tmp/issues-frozen
            .tmp/issues-holdout
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
